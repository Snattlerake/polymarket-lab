services:
  polymarket-lab:
    build: .
    container_name: polymarket-lab
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_FILE: "/app/data/lab.db"
      SCAN_SECONDS: "90"
      MAX_MARKETS: "500"

      # FIRST CLEAN MIGRATION ONLY:
      # Set true for the first startup to delete the old database.
      # Change back to false after that startup.
      RESET_DATABASE_ON_START: "true"

    volumes:
      - polymarket_data:/app/data

volumes:
  polymarket_data:
