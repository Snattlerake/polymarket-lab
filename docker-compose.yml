services:
  polymarket-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-lab
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      HISTORY_DAYS: "30"
      MARKET_LIMIT: "250"
      MAX_HISTORY_TOKENS_PER_CYCLE: "60"
      WORKERS: "4"
      BOOK_POLL_SECONDS: "45"
      MARKET_REFRESH_MINUTES: "15"
      HISTORY_REFRESH_HOURS: "6"
    volumes:
      - polymarket_data:/app/data
    init: true
    stop_grace_period: 20s

volumes:
  polymarket_data:
